name: Apply outreach v5 fixes

on:
  push:
    branches:
      - fix/outreach-v5-clear-offer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outreach-v5-clear-offer
          fetch-depth: 0

      - name: Patch production gates and current-copy tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count:
                  p.write_text(text.replace(old, new))
              print(f"{path}: {count} replacement(s) for {old[:70]!r}")
              return count

          # Recognize the truthful v5 offer in the prospect-facing safety gate.
          p = Path("lib/autonomous-growth.ts")
          text = p.read_text()
          pattern = re.compile(r'(?m)^(\s*)const hasTruthfulReason = (/.+?/i\.test\(body\));$')
          match = pattern.search(text)
          if not match:
              raise SystemExit("Could not find hasTruthfulReason")
          indent, legacy = match.groups()
          new_gate = (
              f"{indent}const hasTruthfulReason = {legacy}\n"
              f"{indent}  || /I can build you a refreshed, more modern website designed to help bring in more calls and quote requests|"
              f"It looks like you don't currently have a full website up\\. I can build you a modern one designed to help bring in more calls and quote requests/i.test(body);"
          )
          p.write_text(pattern.sub(lambda _: new_gate, text, count=1))

          # Keep the first touch to the two approved website-status paths; observations remain manual.
          replace("lib/prospect-engine.ts", "    factualMiddleLine: firstTouchMiddleLine(prospect),\n", "")

          # Use readable readiness checks for the v5 opening, offer, and CTA.
          p = Path("lib/operator-test-center.ts")
          text = p.read_text()
          pattern = re.compile(r'(?m)^  const firstEmailHasApprovedReason = .*;$')
          replacement = '''  const firstEmailHasApprovedReason =
            /I'm Brendan(?:, based in Findlay)?, and I build websites for local service businesses\\./i.test(firstEmail)
            && /I came across [\\s\\S]+(?: while looking at [\\s\\S]+ businesses(?: around [^.]+)?)?\\./i.test(firstEmail)
            && /(?:I can build you a refreshed, more modern website designed to help bring in more calls and quote requests|It looks like you don't currently have a full website up\\. I can build you a modern one designed to help bring in more calls and quote requests)\\./i.test(firstEmail)
            && /Would you be interested in seeing what that could look like\\?/i.test(firstEmail);'''
          updated, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one firstEmailHasApprovedReason, found {count}")
          p.write_text(updated)

          # Update only current-copy assertion literals; leave old-copy fixture bodies intact.
          assertion_replacements = [
              (r'/Would you like me to put together a quick preview\?/i', r'/Would you be interested in seeing what that could look like\?/i'),
              (r'/Would you like me to put together a quick preview\?/', r'/Would you be interested in seeing what that could look like\?/'),
              (r'/make it easier for people to see what you do and call or request a quote/i', r'/refreshed, more modern website designed to help bring in more calls and quote requests/i'),
              (r'/This isn\'t live or anything/', r'/This is not live yet/'),
              (r'/I\'ll put together a quick preview/i', r'/I\'ll put together a website concept and send you a quick video walkthrough/i'),
          ]
          for test_file in Path("tests").glob("*.test.ts"):
              text = test_file.read_text()
              original = text
              for old, new in assertion_replacements:
                  text = text.replace(old, new)
              if text != original:
                  test_file.write_text(text)

          replace("tests/final-manual-workflow-audit.test.ts", "permission-first V3", "permission-first V5")
          for test_path in [
              "tests/autonomous-growth.test.ts",
              "tests/prospect-engine.test.ts",
              "tests/top-prospects.test.ts",
          ]:
              replace(test_path, r'/couldn\'t find a dedicated website/i', r'/don\'t currently have a full website up/i')

          # Replace the exact two-path first-touch expectation block.
          p = Path("tests/prospect-engine.test.ts")
          text = p.read_text()
          start = text.index('  assert.equal(firstTouchEmailDraft(hasWebsite, testFooter), [')
          end_marker = '  ].join("\\n"));\n});\n\ntest("permission-first outreach avoids repeating the business name and stays link-free"'
          end = text.index(end_marker, start)
          new_block = '''  assert.equal(firstTouchEmailDraft(hasWebsite, testFooter), [
            "Hi there,",
            "",
            "I'm Brendan, and I build websites for local service businesses. I came across Styles Power Wash while looking at pressure-washing businesses around St Augustine.",
            "",
            "I can build you a refreshed, more modern website designed to help bring in more calls and quote requests.",
            "",
            "Would you be interested in seeing what that could look like?",
            "",
            testFooter,
          ].join("\\n"));

          const noWebsite = withPresenceGapReview({ ...structuredClone(seedProspects[0]), businessName: "ClearFlow Plumbing", trade: "Plumbing", city: "Toledo", website: "" }, "no_owned_website");
          assert.equal(firstTouchEmailDraft(noWebsite, testFooter), [
            "Hi there,",
            "",
            "I'm Brendan, based in Findlay, and I build websites for local service businesses. I came across ClearFlow Plumbing while looking at plumbing businesses around Toledo.",
            "",
            "It looks like you don't currently have a full website up. I can build you a modern one designed to help bring in more calls and quote requests.",
            "",
            "Would you be interested in seeing what that could look like?",
            "",
            testFooter,
          ].join("\\n"));
});

test("permission-first outreach avoids repeating the business name and stays link-free"'''
          p.write_text(text[:start] + new_block + text[end + len(end_marker):])

          # Align the surrounding current-copy assertions with actual v5 output.
          replacements = [
              (r'/I came across your pressure washing business while looking at companies around Tampa/i', r'/I came across MC Pressure Washing FL while looking at pressure-washing businesses around Tampa/i'),
              (r'/had an idea for a simpler website direction/i', r'/refreshed, more modern website designed to help bring in more calls and quote requests/i'),
              (r'/Hi Styles Power Wash team,\\n\\nI came across your pressure washing business while looking at companies around St Augustine\\./', r'/Hi there,\\n\\nI\'m Brendan, and I build websites for local service businesses\\. I came across Styles Power Wash while looking at pressure-washing businesses around St Augustine\\./'),
              (r'/Hi Styles Power Wash team,\\n\\n[^.]+Styles Power Wash/i', r'/Hi there,\\n\\n[^.]+Styles Power Wash[^.]+Styles Power Wash/i'),
              (r'/idea for what one could look like/i', r'/modern one designed to help bring in more calls and quote requests/i'),
              (r'/I\'ll put together a quick preview and send it over once it\'s ready/i', r'/I\'ll put together a website concept and send you a quick video walkthrough when it\'s ready/i'),
          ]
          for old, new in replacements:
              replace("tests/prospect-engine.test.ts", old, new)
          PY

      - name: Remove helper and commit
        shell: bash
        run: |
          rm .github/workflows/apply-outreach-v5-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib tests .github/workflows/apply-outreach-v5-fixes.yml
          git commit -m "Finish outreach v5 safety and test migration"
          git push origin HEAD:fix/outreach-v5-clear-offer
