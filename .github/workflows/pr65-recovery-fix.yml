name: PR65 recovery fix

on:
  push:
    branches:
      - fix/autopilot-refresh-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'wishart1818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autopilot-refresh-runtime
          fetch-depth: 0
      - name: Patch direct-call recovery boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/engine/autonomous-growth/route.ts')
          text = path.read_text()
          old = '''async function autonomousGrowthDashboardWithRecoveredAutopilot(request: Request) {
            const dashboard = await getAutonomousGrowthDashboard();
            const missingCampaignState = dashboard.autopilot.campaign.status === "draft" && !dashboard.autopilot.activity.topProspectJobId;
            if (!missingCampaignState) return dashboard;
          '''
          new = '''async function autonomousGrowthDashboardWithRecoveredAutopilot(request?: Request) {
            const dashboard = await getAutonomousGrowthDashboard();
            const missingCampaignState = dashboard.autopilot.campaign.status === "draft" && !dashboard.autopilot.activity.topProspectJobId;
            if (!missingCampaignState || !request) return dashboard;
          '''
          # Match without relying on indentation inside this workflow string.
          old = old.replace('          ', '')
          new = new.replace('          ', '')
          if old not in text:
              raise SystemExit('Expected recovery function shape was not found')
          text = text.replace(old, new, 1)
          old_get = 'export async function GET(request: Request) {'
          new_get = 'export async function GET(request?: Request) {'
          if old_get not in text:
              raise SystemExit('Expected GET signature was not found')
          text = text.replace(old_get, new_get, 1)
          path.write_text(text)
          PY
      - name: Remove one-time fixer
        run: rm .github/workflows/pr65-recovery-fix.yml
      - name: Commit fix
        run: |
          git config user.name "wishart1818"
          git config user.email "wishart1818@gmail.com"
          git add app/api/engine/autonomous-growth/route.ts .github/workflows/pr65-recovery-fix.yml
          git commit -m "Keep Autopilot recovery fail-safe for direct route calls"
          git push origin HEAD:fix/autopilot-refresh-runtime
