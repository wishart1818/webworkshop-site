name: Apply outreach v5 patch

on:
  push:
    branches:
      - fix/outreach-v5-clear-offer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outreach-v5-clear-offer
          fetch-depth: 0

      - name: Patch shared engine validation and rewrites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new))

          autonomous = Path("lib/autonomous-growth.ts")
          text = autonomous.read_text()
          old_cta = 'if (!/would you be open|would you want|would you like|want to see it|quick 10-minute call|worth a short call/i.test(outreachText)) plan.add("add one clear CTA");'
          new_cta = 'if (!/would you be open|would you want|would you like|would you be interested|interested in seeing|want to see it|quick 10-minute call|worth a short call/i.test(outreachText)) plan.add("add one clear CTA");'
          if text.count(old_cta) != 1:
              raise SystemExit(f"Expected one CTA matcher, found {text.count(old_cta)}")
          text = text.replace(old_cta, new_cta)

          old_rewrite = '''export function rewriteOutreachWithFixes(emailBody: string) {
            const optOut = emailBody.match(/Thanks,[\\s\\S]*?(?:If you would rather not receive another note, just reply and I will close the loop\\.|If you'd rather not hear from me again, just let me know\\.)/i)?.[0]
              ?? outreachComplianceFooter();
            const lines = emailBody.split("\\n").map((line) => line.trim()).filter(Boolean);
            const greeting = lines.find((line) => /^Hi\\b/i.test(line)) ?? "Hi there,";
            const contextualOpening = lines.find((line) => /^I came across\\b/i.test(line))
              ?? "I came across your business.";
            return [
              greeting,
              "",
              contextualOpening,
              "",
              "I had a simple website idea that could make it easier for people to see what you do and call or request a quote.",
              "",
              "Would you like me to put together a quick preview?",
              "",
              optOut,
            ].join("\\n");
          }'''
          new_rewrite = '''export function rewriteOutreachWithFixes(emailBody: string) {
            const optOut = emailBody.match(/Thanks,[\\s\\S]*?(?:If you would rather not receive another note, just reply and I will close the loop\\.|If you'd rather not hear from me again, just let me know\\.)/i)?.[0]
              ?? outreachComplianceFooter();
            const lines = emailBody.split("\\n").map((line) => line.trim()).filter(Boolean);
            const greeting = lines.find((line) => /^Hi\\b/i.test(line)) ?? "Hi there,";
            const combinedIntroduction = lines.find((line) => /^I'm Brendan\\b/i.test(line)) ?? "";
            const introduction = combinedIntroduction
              ? combinedIntroduction.replace(/\\s+I came across[\\s\\S]*$/i, "").trim()
              : "I'm Brendan, and I build websites for local service businesses.";
            const contextualOpening = lines.find((line) => /^I came across\\b/i.test(line))
              ?? combinedIntroduction.match(/\\bI came across[\\s\\S]*$/i)?.[0]
              ?? "I came across your business.";
            const noWebsite = /don't currently have a full website up|couldn't find a dedicated website|did not have a dedicated website/i.test(emailBody);
            const offer = noWebsite
              ? "It looks like you don't currently have a full website up. I can build you a modern one designed to help bring in more calls and quote requests."
              : "I can build you a refreshed, more modern website designed to help bring in more calls and quote requests.";
            return [
              greeting,
              "",
              `${introduction} ${contextualOpening}`,
              "",
              offer,
              "",
              "Would you be interested in seeing what that could look like?",
              "",
              optOut,
            ].join("\\n");
          }'''
          if text.count(old_rewrite) != 1:
              raise SystemExit(f"Expected one rewrite function, found {text.count(old_rewrite)}")
          text = text.replace(old_rewrite, new_rewrite)
          text = text.replace(
              'websiteExplanation: "It\'s a simple website concept focused on making the page cleaner and helping people call or request a quote.",',
              'websiteExplanation: "It\'s a custom website concept showing a more modern direction designed to help bring in more calls and quote requests.",',
          )
          text = text.replace(
              'nextStepsReply: "Yeah, if you like the direction, I can finish it out and get it ready to go live for you.",',
              'nextStepsReply: "Yeah, if you like the direction, I can finish the full website and get it ready to go live for you.",',
          )
          autonomous.write_text(text)

          operator = Path("lib/operator-test-center.ts")
          text = operator.read_text()
          old_reason = 'const firstEmailHasApprovedReason = /I came across (?:your [^.]+ business(?: while looking at companies around [^.]+)?|your business(?: while looking at companies around [^.]+)?)\\.[\\s\\S]+(?:couldn\'t find a dedicated website|had an idea for a simpler website direction)[\\s\\S]+Would you like me to put together a quick preview\\?/i.test(firstEmail);'
          new_reason = 'const firstEmailHasApprovedReason = /I\'m Brendan(?:, based in Findlay)?, and I build websites for local service businesses\\.[\\s\\S]+I came across [^.]+(?: while looking at [^.]+ businesses(?: around [^.]+)?)?\\.[\\s\\S]+(?:I can build you a refreshed, more modern website|It looks like you don\'t currently have a full website up\\. I can build you a modern one)[\\s\\S]+Would you be interested in seeing what that could look like\\?/i.test(firstEmail);'
          if text.count(old_reason) != 1:
              raise SystemExit(f"Expected one readiness reason regex, found {text.count(old_reason)}")
          text = text.replace(old_reason, new_reason)

          old_wording = 'check(checks, { key: "current-wording", category: "Outreach copy quality", label: "Uses the current permission-first website wording", passed: /easier for people to (?:see what you do and )?call or request a quote/i.test(fakeCopyBlob) && /Would you like me to put together a quick preview\\?/i.test(fakeCopyBlob), detail: "Fake copy uses the current direct, truthful manual-build wording." });'
          new_wording = 'check(checks, { key: "current-wording", category: "Outreach copy quality", label: "Uses the current permission-first website wording", passed: /designed to help bring in more calls and quote requests/i.test(fakeCopyBlob) && /Would you be interested in seeing what that could look like\\?/i.test(fakeCopyBlob), detail: "Fake copy clearly offers a new or refreshed website, states the practical goal without guaranteeing results, and asks permission to show the concept." });'
          if text.count(old_wording) != 1:
              raise SystemExit(f"Expected one current-wording check, found {text.count(old_wording)}")
          text = text.replace(old_wording, new_wording)
          operator.write_text(text)
          PY

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/apply-outreach-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/autonomous-growth.ts lib/operator-test-center.ts .github/workflows/apply-outreach-v5.yml
          git commit -m "Align engine rewrites and readiness checks with outreach v5"
          git push origin HEAD:fix/outreach-v5-clear-offer
