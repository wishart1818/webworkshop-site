name: Temporary branch fix

on:
  push:
    branches:
      - fix/no-site-discovery-handoff

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-site-discovery-handoff
      - name: Apply exact bounded replacements
        shell: python
        run: |
          from pathlib import Path

          worker = Path('lib/top-prospect-worker.ts')
          text = worker.read_text()
          old = 'const qualificationBreakdown = combineQualificationBreakdowns(input.results);'
          assert text.count(old) == 2, text.count(old)
          text = text.replace(old, 'const qualificationBreakdown = combineQualificationBreakdowns(input.results.map((item) => item.result));')
          worker.write_text(text)

          tests = Path('tests/lead-discovery.test.ts')
          text = tests.read_text()
          old_mask = 'places.displayName,places.formattedAddress,places.location,places.websiteUri,places.nationalPhoneNumber,places.rating,places.userRatingCount'
          new_mask = 'places.displayName,places.formattedAddress,places.addressComponents,places.location,places.websiteUri,places.googleMapsUri,places.nationalPhoneNumber,places.rating,places.userRatingCount'
          assert text.count(old_mask) == 1, text.count(old_mask)
          tests.write_text(text.replace(old_mask, new_mask))
      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/top-prospect-worker.ts tests/lead-discovery.test.ts
          git diff --cached --check
          git commit -m "Fix discovery aggregation regressions"
          git push origin HEAD:fix/no-site-discovery-handoff
