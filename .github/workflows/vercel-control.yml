name: Vercel Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: webworkshop-vercel-control
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.number == 3 &&
      github.actor == 'wishart1818' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/vercel ')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMMAND: ${{ github.event.comment.body }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: webworkshop-site
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "❌ Vercel control is not configured yet. Add the GitHub repository secret \`VERCEL_TOKEN\` under Settings → Secrets and variables → Actions, then retry."
            exit 1
          fi

      - name: Link selected Vercel project
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/tmp/vercel-link.log 2>&1; then
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "❌ The Vercel token was found, but it could not link to \`$VERCEL_PROJECT_NAME\`. Make sure the token scope includes the account or team that owns that project. No settings were changed."
            exit 1
          fi
          npx --yes vercel@latest project inspect --token "$VERCEL_TOKEN" >/dev/null

      - name: Execute whitelisted command
        shell: bash
        run: |
          set -euo pipefail

          comment() {
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$1"
          }

          set_env() {
            local key="$1"
            local value="$2"
            printf '%s' "$value" | npx --yes vercel@latest env add "$key" production --force --token "$VERCEL_TOKEN" >/dev/null
          }

          deploy_production() {
            local url
            url="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")"
            printf '%s' "$url"
          }

          fail_closed() {
            local phase="$1"
            set +e
            set_env AUTOPILOT_DISABLED true
            set_env OUTREACH_AUTO_SEND_ENABLED false
            set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
            set_env OUTREACH_DAILY_CAP 1
            set_env OUTREACH_EMAIL_DISABLED true
            local url
            url="$(deploy_production)"
            comment "❌ Pilot verification failed during ${phase}. Outreach was automatically disabled and production was redeployed fail-closed. Deployment: ${url:-unavailable}. No prospect test email was intentionally sent."
            exit 1
          }

          case "$COMMAND" in
            "/vercel status")
              npx --yes vercel@latest env ls production --token "$VERCEL_TOKEN" >/tmp/vercel-env-list.txt
              comment "✅ Vercel connection succeeded for \`$VERCEL_PROJECT_NAME\`. Production environment variables are accessible. No settings were changed and no deployment was started."
              ;;

            "/vercel pilot-off")
              set_env AUTOPILOT_DISABLED true
              set_env OUTREACH_AUTO_SEND_ENABLED false
              set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
              set_env OUTREACH_DAILY_CAP 1
              set_env OUTREACH_EMAIL_DISABLED true
              url="$(deploy_production)"
              comment "✅ Outreach was disabled and production was redeployed. Daily cap remains 1. Deployment: ${url}"
              ;;

            "/vercel pilot-test CONFIRM")
              npx --yes vercel@latest env ls production --token "$VERCEL_TOKEN" >/tmp/vercel-env-list.txt
              required=(DATABASE_URL RESEND_API_KEY OUTREACH_FROM_EMAIL OUTREACH_REPLY_TO_EMAIL WEBWORKSHOP_POSTAL_ADDRESS)
              missing=()
              for key in "${required[@]}"; do
                grep -q "$key" /tmp/vercel-env-list.txt || missing+=("$key")
              done
              if (( ${#missing[@]} > 0 )); then
                comment "❌ Pilot was not enabled. Required Production variable name(s) are missing: \`${missing[*]}\`. No settings were changed."
                exit 1
              fi
              set_env AUTOPILOT_DISABLED false
              set_env OUTREACH_AUTO_SEND_ENABLED true
              set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
              set_env OUTREACH_DAILY_CAP 1
              set_env OUTREACH_EMAIL_DISABLED false
              set_env OUTREACH_SEND_PROVIDER resend
              url="$(deploy_production)"
              comment "✅ Reviewed Auto Email Pilot test mode was enabled with a daily cap of 1 and full-auto disabled. Production was redeployed: ${url}"
              ;;

            "/vercel verify-pilot CONFIRM")
              if ! npm ci >/tmp/pilot-npm-ci.log 2>&1; then
                tail -80 /tmp/pilot-npm-ci.log
                fail_closed "dependency installation"
              fi
              if ! npx tsx --test tests/autonomous-growth.test.ts >/tmp/pilot-tests.log 2>&1; then
                tail -120 /tmp/pilot-tests.log
                fail_closed "focused safety tests"
              fi

              if ! npx --yes vercel@latest curl /api/engine/autonomous-growth --token "$VERCEL_TOKEN" >/tmp/dashboard-before.json 2>/tmp/dashboard-before.err; then
                cat /tmp/dashboard-before.err
                fail_closed "production dashboard/database health check"
              fi
              if ! node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/dashboard-before.json', 'utf8'));
          if (!data || typeof data !== 'object' || !data.settings || !Array.isArray(data.queue)) {
            throw new Error('Production dashboard did not return settings and a queue array.');
          }
          const summary = {
            sent: data.queue.filter((item) => item && item.status === 'Sent').length,
            sending: data.queue.filter((item) => item && item.status === 'Sending').length,
            queueLength: data.queue.length,
          };
          fs.writeFileSync('/tmp/queue-before.json', JSON.stringify(summary));
          NODE
              then
                fail_closed "production dashboard response validation"
              fi

              if ! npx --yes vercel@latest curl /api/engine/autonomous-growth --token "$VERCEL_TOKEN" -X POST -H "Content-Type: application/json" -d '{"action":"run_fake_autopilot_smoke_test"}' >/tmp/fake-smoke.json 2>/tmp/fake-smoke.err; then
                cat /tmp/fake-smoke.err
                fail_closed "production fake pipeline smoke test"
              fi
              if ! node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/fake-smoke.json', 'utf8'));
          const result = data.smokeTest || data.autopilotSmokeTest || data;
          if (!result || result.passed !== true) {
            throw new Error('The fake Autopilot pipeline smoke test did not pass.');
          }
          NODE
              then
                fail_closed "production fake pipeline smoke-test assertions"
              fi

              cat >/tmp/provider-verification.mjs <<'NODE'
          import fs from 'node:fs';

          const required = [
            'DATABASE_URL',
            'RESEND_API_KEY',
            'OUTREACH_FROM_EMAIL',
            'OUTREACH_REPLY_TO_EMAIL',
            'WEBWORKSHOP_POSTAL_ADDRESS',
          ];
          const missing = required.filter((key) => !String(process.env[key] || '').trim());
          if (missing.length) throw new Error(`Missing required Production variables: ${missing.join(', ')}`);

          const expected = {
            AUTOPILOT_DISABLED: 'false',
            OUTREACH_AUTO_SEND_ENABLED: 'true',
            OUTREACH_FULL_AUTO_SEND_ENABLED: 'false',
            OUTREACH_DAILY_CAP: '1',
            OUTREACH_EMAIL_DISABLED: 'false',
            OUTREACH_SEND_PROVIDER: 'resend',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (String(process.env[key] || '').trim().toLowerCase() !== value) {
              throw new Error(`Production safety flag ${key} is not set to the expected value.`);
            }
          }

          const to = process.env.OUTREACH_REPLY_TO_EMAIL.trim();
          const response = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.RESEND_API_KEY.trim()}`,
              'Content-Type': 'application/json',
              'Idempotency-Key': `webworkshop-pilot-verification-${process.env.GITHUB_RUN_ID || Date.now()}`,
            },
            body: JSON.stringify({
              from: process.env.OUTREACH_FROM_EMAIL.trim(),
              to: [to],
              reply_to: to,
              subject: '[WebWorkshop] Auto Email Pilot delivery test',
              text: 'This is a controlled WebWorkshop delivery verification sent only to the configured operator reply-to address. No prospect was contacted.',
            }),
          });
          if (!response.ok) throw new Error(`Resend rejected the controlled delivery test with HTTP ${response.status}.`);
          const payload = await response.json();
          if (!payload || typeof payload.id !== 'string' || !payload.id.trim()) {
            throw new Error('Resend accepted the request without returning a valid message ID.');
          }
          fs.writeFileSync('/tmp/provider-result.json', JSON.stringify({ ok: true, id: payload.id.trim() }));
          NODE
              if ! npx --yes vercel@latest env run -e production --token "$VERCEL_TOKEN" -- node /tmp/provider-verification.mjs >/tmp/provider-verification.log 2>&1; then
                cat /tmp/provider-verification.log
                fail_closed "production safety-flag or Resend delivery verification"
              fi

              if ! npx --yes vercel@latest curl /api/engine/autonomous-growth --token "$VERCEL_TOKEN" >/tmp/dashboard-after.json 2>/tmp/dashboard-after.err; then
                cat /tmp/dashboard-after.err
                fail_closed "post-verification dashboard check"
              fi
              if ! node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/queue-before.json', 'utf8'));
          const data = JSON.parse(fs.readFileSync('/tmp/dashboard-after.json', 'utf8'));
          if (!data || !Array.isArray(data.queue)) throw new Error('Post-verification queue could not be read.');
          const after = {
            sent: data.queue.filter((item) => item && item.status === 'Sent').length,
            sending: data.queue.filter((item) => item && item.status === 'Sending').length,
            queueLength: data.queue.length,
          };
          if (after.sent !== before.sent) throw new Error('A prospect queue item changed to Sent during verification.');
          if (after.sending !== before.sending) throw new Error('A prospect queue item changed Sending state during verification.');
          NODE
              then
                fail_closed "no-prospect-contact invariant"
              fi

              provider_id="$(node -e "const r=require('/tmp/provider-result.json'); process.stdout.write(r.id)")"
              comment "✅ Auto Email Pilot verification passed end to end: focused safety tests passed, the production database/dashboard loaded, the fake pipeline smoke test passed, all safety flags matched, Resend accepted a controlled email to the configured operator reply-to, and no prospect queue item was sent or left Sending. Provider message ID: ${provider_id}. Daily cap remains 1 and full-auto remains disabled."
              ;;

            "/vercel redeploy")
              url="$(deploy_production)"
              comment "✅ Production was redeployed without changing environment variables: ${url}"
              ;;

            *)
              comment "❌ Command rejected. Allowed commands are: \`/vercel status\`, \`/vercel pilot-off\`, \`/vercel pilot-test CONFIRM\`, \`/vercel verify-pilot CONFIRM\`, and \`/vercel redeploy\`."
              exit 1
              ;;
          esac
