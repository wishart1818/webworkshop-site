name: Vercel Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: webworkshop-vercel-control
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.number == 3 &&
      github.actor == 'wishart1818' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/vercel ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.comment.body }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: webworkshop-site
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "❌ Add the GitHub Actions secret \`VERCEL_TOKEN\`, then retry."
            exit 1
          fi

      - name: Link selected Vercel project
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/tmp/vercel-link.log 2>&1; then
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "❌ The token could not link to \`$VERCEL_PROJECT_NAME\`. No settings were changed."
            exit 1
          fi
          npx --yes vercel@latest project inspect --token "$VERCEL_TOKEN" >/dev/null

      - name: Execute whitelisted command
        shell: bash
        run: |
          set -euo pipefail

          comment() {
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$1"
          }

          set_env() {
            local key="$1"
            local value="$2"
            printf '%s' "$value" | npx --yes vercel@latest env add "$key" production --force --token "$VERCEL_TOKEN" >/dev/null
          }

          enable_reviewed_pilot() {
            set_env AUTOPILOT_DISABLED false
            set_env OUTREACH_AUTO_SEND_ENABLED true
            set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
            set_env OUTREACH_DAILY_CAP 1
            set_env OUTREACH_EMAIL_DISABLED false
            set_env OUTREACH_SEND_PROVIDER resend
          }

          disable_outreach() {
            set_env AUTOPILOT_DISABLED true
            set_env OUTREACH_AUTO_SEND_ENABLED false
            set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
            set_env OUTREACH_DAILY_CAP 1
            set_env OUTREACH_EMAIL_DISABLED true
          }

          deploy_production() {
            npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          }

          required_variables_present() {
            npx --yes vercel@latest env ls production --token "$VERCEL_TOKEN" >/tmp/vercel-env-list.txt
            local required=(DATABASE_URL RESEND_API_KEY OUTREACH_FROM_EMAIL OUTREACH_REPLY_TO_EMAIL WEBWORKSHOP_POSTAL_ADDRESS)
            local missing=()
            local key
            for key in "${required[@]}"; do
              grep -q "$key" /tmp/vercel-env-list.txt || missing+=("$key")
            done
            if (( ${#missing[@]} > 0 )); then
              comment "❌ Required Production variable name(s) are missing: \`${missing[*]}\`. No prospect email was sent."
              return 1
            fi
          }

          fail_closed() {
            local phase="$1"
            set +e
            disable_outreach
            local safe_url
            safe_url="$(deploy_production)"
            comment "❌ Pilot verification failed during ${phase}. Outreach was automatically disabled and production was redeployed fail-closed. Deployment: ${safe_url:-unavailable}. No prospect test email was intentionally sent."
            exit 1
          }

          vercel_request() {
            local url="$1"
            shift
            npx --yes vercel@latest curl "$url" --token "$VERCEL_TOKEN" --silent --show-error --fail-with-body "$@"
          }

          case "$COMMAND" in
            "/vercel status")
              required_variables_present
              comment "✅ Vercel connection and required Production variable names are available for \`$VERCEL_PROJECT_NAME\`. No settings changed and no deployment started."
              ;;

            "/vercel pilot-off")
              disable_outreach
              url="$(deploy_production)"
              comment "✅ Outreach was disabled and production was redeployed. Daily cap remains 1. Deployment: ${url}"
              ;;

            "/vercel pilot-test CONFIRM")
              required_variables_present
              enable_reviewed_pilot
              url="$(deploy_production)"
              comment "✅ Reviewed Auto Email Pilot test mode was enabled with a daily cap of 1 and full-auto disabled. Production was redeployed: ${url}"
              ;;

            "/vercel verify-pilot CONFIRM")
              required_variables_present || fail_closed "required-variable validation"

              if ! npm ci >/tmp/pilot-npm-ci.log 2>&1; then
                tail -80 /tmp/pilot-npm-ci.log
                fail_closed "dependency installation"
              fi
              if ! npx tsx --test tests/autonomous-growth.test.ts >/tmp/pilot-tests.log 2>&1; then
                tail -120 /tmp/pilot-tests.log
                fail_closed "focused safety tests"
              fi

              enable_reviewed_pilot
              verification_url="$(deploy_production)"

              if ! vercel_request "${verification_url}/api/engine/autonomous-growth" --output /tmp/dashboard-before.json 2>/tmp/dashboard-before.err; then
                cat /tmp/dashboard-before.err
                [[ -f /tmp/dashboard-before.json ]] && head -c 1000 /tmp/dashboard-before.json || true
                fail_closed "production dashboard/database health check"
              fi

              if ! node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/dashboard-before.json', 'utf8'));
          if (!data || typeof data !== 'object' || !data.settings || !Array.isArray(data.queue)) {
            throw new Error('Production dashboard did not return settings and a queue array.');
          }
          fs.writeFileSync('/tmp/queue-before.json', JSON.stringify({
            sent: data.queue.filter((item) => item?.status === 'Sent').length,
            sending: data.queue.filter((item) => item?.status === 'Sending').length,
          }));
          NODE
              then
                fail_closed "production dashboard response validation"
              fi

              if ! vercel_request "${verification_url}/api/engine/autonomous-growth" \
                -X POST -H "Content-Type: application/json" \
                -d '{"action":"run_fake_autopilot_smoke_test"}' \
                --output /tmp/fake-smoke.json 2>/tmp/fake-smoke.err; then
                cat /tmp/fake-smoke.err
                [[ -f /tmp/fake-smoke.json ]] && head -c 1000 /tmp/fake-smoke.json || true
                fail_closed "production fake pipeline smoke test"
              fi

              if ! node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/fake-smoke.json', 'utf8'));
          const result = data.smokeTest || data.autopilotSmokeTest || data;
          if (result?.passed !== true) throw new Error('The fake Autopilot pipeline smoke test did not pass.');
          NODE
              then
                fail_closed "production fake pipeline smoke-test assertions"
              fi

              cat >/tmp/provider-verification.mjs <<'NODE'
          import fs from 'node:fs';
          const expected = {
            AUTOPILOT_DISABLED: 'false',
            OUTREACH_AUTO_SEND_ENABLED: 'true',
            OUTREACH_FULL_AUTO_SEND_ENABLED: 'false',
            OUTREACH_DAILY_CAP: '1',
            OUTREACH_EMAIL_DISABLED: 'false',
            OUTREACH_SEND_PROVIDER: 'resend',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (String(process.env[key] || '').trim().toLowerCase() !== value) {
              throw new Error(`Production safety flag ${key} is not set to the expected value.`);
            }
          }
          const required = ['DATABASE_URL', 'RESEND_API_KEY', 'OUTREACH_FROM_EMAIL', 'OUTREACH_REPLY_TO_EMAIL', 'WEBWORKSHOP_POSTAL_ADDRESS'];
          const missing = required.filter((key) => !String(process.env[key] || '').trim());
          if (missing.length) throw new Error(`Missing required Production variables: ${missing.join(', ')}`);

          const to = process.env.OUTREACH_REPLY_TO_EMAIL.trim();
          const response = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.RESEND_API_KEY.trim()}`,
              'Content-Type': 'application/json',
              'Idempotency-Key': `webworkshop-pilot-verification-${process.env.GITHUB_RUN_ID || Date.now()}`,
            },
            body: JSON.stringify({
              from: process.env.OUTREACH_FROM_EMAIL.trim(),
              to: [to],
              reply_to: to,
              subject: '[WebWorkshop] Auto Email Pilot delivery test',
              text: 'Controlled WebWorkshop delivery verification sent only to the configured operator reply-to address. No prospect was contacted.',
            }),
          });
          if (!response.ok) throw new Error(`Resend rejected the controlled delivery test with HTTP ${response.status}.`);
          const payload = await response.json();
          if (typeof payload?.id !== 'string' || !payload.id.trim()) throw new Error('Resend did not return a valid message ID.');
          fs.writeFileSync('/tmp/provider-result.json', JSON.stringify({ id: payload.id.trim() }));
          NODE

              if ! npx --yes vercel@latest env run -e production --token "$VERCEL_TOKEN" -- node /tmp/provider-verification.mjs >/tmp/provider-verification.log 2>&1; then
                cat /tmp/provider-verification.log
                fail_closed "production safety-flag or Resend delivery verification"
              fi

              if ! vercel_request "${verification_url}/api/engine/autonomous-growth" --output /tmp/dashboard-after.json 2>/tmp/dashboard-after.err; then
                cat /tmp/dashboard-after.err
                fail_closed "post-verification dashboard check"
              fi

              if ! node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/queue-before.json', 'utf8'));
          const data = JSON.parse(fs.readFileSync('/tmp/dashboard-after.json', 'utf8'));
          if (!Array.isArray(data?.queue)) throw new Error('Post-verification queue could not be read.');
          const after = {
            sent: data.queue.filter((item) => item?.status === 'Sent').length,
            sending: data.queue.filter((item) => item?.status === 'Sending').length,
          };
          if (after.sent !== before.sent) throw new Error('A prospect queue item changed to Sent during verification.');
          if (after.sending !== before.sending) throw new Error('A prospect queue item changed Sending state during verification.');
          NODE
              then
                fail_closed "no-prospect-contact invariant"
              fi

              provider_id="$(node -e "const r=require('/tmp/provider-result.json'); process.stdout.write(r.id)")"
              disable_outreach
              safe_url="$(deploy_production)"
              comment "✅ Auto Email Pilot verification passed: focused safety tests, production database/dashboard, fake pipeline, safety flags, and controlled Resend delivery all succeeded; no prospect queue item was sent or left Sending. Provider message ID: ${provider_id}. Outreach was then disabled again and production redeployed fail-closed at ${safe_url}."
              ;;

            "/vercel redeploy")
              url="$(deploy_production)"
              comment "✅ Production was redeployed without changing environment variables: ${url}"
              ;;

            *)
              comment "❌ Command rejected. Allowed: \`/vercel status\`, \`/vercel pilot-off\`, \`/vercel pilot-test CONFIRM\`, \`/vercel verify-pilot CONFIRM\`, \`/vercel redeploy\`."
              exit 1
              ;;
          esac
