name: Vercel Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: webworkshop-vercel-control
  cancel-in-progress: true

jobs:
  control:
    if: >-
      github.event.issue.number == 4 &&
      github.actor == 'wishart1818' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/vercel ')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMMAND: ${{ github.event.comment.body }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: webworkshop-site
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "❌ Vercel control is not configured. Add the GitHub Actions secret \`VERCEL_TOKEN\`, then retry."
            exit 1
          fi

      - name: Link selected Vercel project
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/tmp/vercel-link.log 2>&1; then
            gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "❌ The Vercel token could not link to \`$VERCEL_PROJECT_NAME\`. No settings were changed."
            exit 1
          fi
          npx --yes vercel@latest project inspect --token "$VERCEL_TOKEN" >/dev/null

      - name: Execute whitelisted command
        shell: bash
        run: |
          set -euo pipefail

          comment() {
            gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "$1"
          }

          set_env() {
            local key="$1"
            local value="$2"
            printf '%s' "$value" | npx --yes vercel@latest env add "$key" production --force --token "$VERCEL_TOKEN" >/dev/null
          }

          disable_outreach() {
            set_env AUTOPILOT_DISABLED true
            set_env OUTREACH_AUTO_SEND_ENABLED false
            set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
            set_env OUTREACH_DAILY_CAP 1
            set_env OUTREACH_EMAIL_DISABLED true
          }

          enable_reviewed_pilot() {
            set_env AUTOPILOT_DISABLED false
            set_env OUTREACH_AUTO_SEND_ENABLED true
            set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
            set_env OUTREACH_DAILY_CAP 1
            set_env OUTREACH_EMAIL_DISABLED false
            set_env OUTREACH_SEND_PROVIDER resend
          }

          deploy_production() {
            npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          }

          required_variables_present() {
            npx --yes vercel@latest env ls production --token "$VERCEL_TOKEN" >/tmp/vercel-env-list.txt
            local required=(DATABASE_URL RESEND_API_KEY OUTREACH_FROM_EMAIL OUTREACH_REPLY_TO_EMAIL WEBWORKSHOP_POSTAL_ADDRESS)
            local missing=()
            local key
            for key in "${required[@]}"; do
              grep -q "$key" /tmp/vercel-env-list.txt || missing+=("$key")
            done
            if (( ${#missing[@]} > 0 )); then
              comment "❌ Required Production variable name(s) are missing: \`${missing[*]}\`. No prospect email was sent."
              return 1
            fi
          }

          case "$COMMAND" in
            "/vercel status")
              required_variables_present
              comment "✅ Vercel connection and required Production variable names are available for \`$VERCEL_PROJECT_NAME\`. No settings changed and no deployment started."
              ;;

            "/vercel pilot-off")
              disable_outreach
              url="$(deploy_production)"
              comment "✅ Outreach was disabled and production was redeployed. Daily cap remains 1. Deployment: ${url}"
              ;;

            "/vercel pilot-test CONFIRM")
              required_variables_present
              enable_reviewed_pilot
              url="$(deploy_production)"
              comment "✅ Reviewed Auto Email Pilot test mode was enabled with a daily cap of 1 and full-auto disabled. Production was redeployed: ${url}"
              ;;

            "/vercel health")
              required_variables_present
              disable_outreach
              url="$(deploy_production)"
              set +e
              response="$(npx --yes vercel@latest curl "${url}/api/health/autopilot" 2>&1)"
              status=$?
              set -e
              safe_response="$(printf '%s' "$response" | head -c 1200 | tr '\r\n' '  ' | sed -E 's/[[:space:]]+/ /g; s/`/'"'"'/g')"
              if [[ $status -eq 0 ]] && printf '%s' "$response" | grep -q '"ok":true'; then
                comment "✅ Fail-closed production health probe passed. Required environment variables are present, the database/dashboard queue is readable, outreach is disabled, and the daily cap is 1. Deployment: ${url}. Probe: \`${safe_response}\`"
              else
                comment "❌ Fail-closed production health probe did not pass. Outreach remains disabled and the daily cap remains 1. Deployment: ${url}. Probe: \`${safe_response:-empty}\`"
                exit 1
              fi
              ;;

            "/vercel provider-test CONFIRM")
              required_variables_present
              disable_outreach
              safe_url="$(deploy_production)"

              if ! npm ci >/tmp/provider-npm-ci.log 2>&1; then
                comment "❌ Controlled provider verification stopped because dependencies could not be installed. Outreach remains disabled."
                exit 1
              fi
              if ! npx tsx --test tests/autonomous-growth.test.ts >/tmp/provider-safety-tests.log 2>&1; then
                comment "❌ Controlled provider verification stopped because focused Auto Email Pilot safety tests failed. Outreach remains disabled."
                exit 1
              fi

              cat >/tmp/provider-test.mjs <<'NODE'
          import fs from 'node:fs';

          const required = [
            'RESEND_API_KEY',
            'OUTREACH_FROM_EMAIL',
            'OUTREACH_REPLY_TO_EMAIL',
          ];
          const missing = required.filter((key) => !String(process.env[key] || '').trim());
          if (missing.length) throw new Error('Required provider configuration is missing.');

          const expected = {
            AUTOPILOT_DISABLED: 'true',
            OUTREACH_AUTO_SEND_ENABLED: 'false',
            OUTREACH_FULL_AUTO_SEND_ENABLED: 'false',
            OUTREACH_DAILY_CAP: '1',
            OUTREACH_EMAIL_DISABLED: 'true',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (String(process.env[key] || '').trim().toLowerCase() !== value) {
              throw new Error(`Fail-closed safety flag ${key} is not set correctly.`);
            }
          }

          const replyTo = process.env.OUTREACH_REPLY_TO_EMAIL.trim();
          const response = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.RESEND_API_KEY.trim()}`,
              'Content-Type': 'application/json',
              'Idempotency-Key': `webworkshop-controlled-provider-test-${process.env.GITHUB_RUN_ID || Date.now()}`,
            },
            body: JSON.stringify({
              from: process.env.OUTREACH_FROM_EMAIL.trim(),
              to: [replyTo],
              reply_to: replyTo,
              subject: '[WebWorkshop] Controlled Auto Email Pilot verification',
              text: 'This controlled verification was sent only to the configured WebWorkshop operator reply-to address. No prospect was contacted. Outreach remains disabled and the daily cap remains 1.',
            }),
          });

          if (!response.ok) throw new Error(`Resend rejected the controlled verification with HTTP ${response.status}.`);
          const payload = await response.json();
          if (typeof payload?.id !== 'string' || !payload.id.trim()) {
            throw new Error('Resend did not return a valid provider message ID.');
          }
          fs.writeFileSync('/tmp/provider-result.json', JSON.stringify({ id: payload.id.trim() }));
          NODE

              if ! npx --yes vercel@latest env run -e production --token "$VERCEL_TOKEN" -- node /tmp/provider-test.mjs >/tmp/provider-test.log 2>&1; then
                safe_error="$(tail -c 900 /tmp/provider-test.log | tr '\r\n' '  ' | sed -E 's/[[:space:]]+/ /g; s/`/'"'"'/g; s/(Bearer|token|secret|password|api[_-]?key)[=: ]+[^ ]+/<redacted>/Ig')"
                comment "❌ Controlled Resend verification failed. Outreach remains disabled and the daily cap remains 1. Error: \`${safe_error:-provider test failed}\`"
                exit 1
              fi

              provider_id="$(node -e "const r=require('/tmp/provider-result.json'); process.stdout.write(r.id)")"
              comment "✅ Controlled provider verification passed. Focused Auto Email Pilot safety tests passed, Resend accepted one test email sent only to the configured operator reply-to address, and no prospect was contacted. Provider message ID: \`${provider_id}\`. Outreach remains disabled, full-auto remains disabled, and the daily cap remains 1. Production: ${safe_url}"
              ;;

            "/vercel redeploy")
              url="$(deploy_production)"
              comment "✅ Production was redeployed without changing environment variables: ${url}"
              ;;

            *)
              comment "❌ Command rejected. Allowed: \`/vercel status\`, \`/vercel pilot-off\`, \`/vercel pilot-test CONFIRM\`, \`/vercel health\`, \`/vercel provider-test CONFIRM\`, and \`/vercel redeploy\`."
              exit 1
              ;;
          esac
