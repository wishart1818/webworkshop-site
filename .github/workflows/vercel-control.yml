name: Vercel Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: webworkshop-vercel-control
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.number == 3 &&
      github.actor == 'wishart1818' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/vercel ')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMMAND: ${{ github.event.comment.body }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: webworkshop-site
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "❌ Vercel control is not configured yet. Add the GitHub repository secret \`VERCEL_TOKEN\` under Settings → Secrets and variables → Actions, then retry."
            exit 1
          fi

      - name: Resolve and link selected Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel

          if [[ -n "${VERCEL_ORG_ID:-}" && -n "${VERCEL_PROJECT_ID:-}" ]]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            node <<'NODE'
          const fs = require('fs');

          const token = process.env.VERCEL_TOKEN;
          const targetName = process.env.VERCEL_PROJECT_NAME;
          const headers = { Authorization: `Bearer ${token}` };

          async function getJson(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) {
              const text = await response.text();
              throw new Error(`${response.status} ${response.statusText}: ${text.slice(0, 500)}`);
            }
            return response.json();
          }

          (async () => {
            const scopes = [{ label: 'personal account', teamId: '' }];
            const teamsPayload = await getJson('https://api.vercel.com/v2/teams?limit=100');
            for (const team of teamsPayload.teams || []) {
              scopes.push({ label: team.name || team.slug || team.id, teamId: team.id });
            }

            const matches = [];
            for (const scope of scopes) {
              const query = new URLSearchParams({ limit: '100' });
              if (scope.teamId) query.set('teamId', scope.teamId);
              let payload;
              try {
                payload = await getJson(`https://api.vercel.com/v9/projects?${query}`);
              } catch (error) {
                if (!scope.teamId) continue;
                throw error;
              }
              for (const project of payload.projects || []) {
                if (project.name === targetName) matches.push({ project, scope });
              }
            }

            if (matches.length === 0) {
              throw new Error(`No accessible Vercel project named ${targetName} was found for this token.`);
            }
            if (matches.length > 1) {
              const labels = matches.map(({ scope, project }) => `${scope.label} (${project.id})`).join(', ');
              throw new Error(`More than one project named ${targetName} was found: ${labels}. Add VERCEL_ORG_ID and VERCEL_PROJECT_ID to select one explicitly.`);
            }

            const { project, scope } = matches[0];
            const orgId = project.accountId || scope.teamId;
            if (!orgId || !project.id) throw new Error('Vercel did not return the selected project identifiers.');

            fs.writeFileSync('.vercel/project.json', `${JSON.stringify({ orgId, projectId: project.id })}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `RESOLVED_VERCEL_ORG_ID=${orgId}\nRESOLVED_VERCEL_PROJECT_ID=${project.id}\nRESOLVED_VERCEL_PROJECT_NAME=${project.name}\n`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          });
          NODE
          fi

          npx --yes vercel@latest project inspect --token "$VERCEL_TOKEN" >/dev/null

      - name: Execute whitelisted command
        shell: bash
        run: |
          set -euo pipefail

          comment() {
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$1"
          }

          set_env() {
            local key="$1"
            local value="$2"
            printf '%s' "$value" | npx --yes vercel@latest env add "$key" production --force --token "$VERCEL_TOKEN" >/dev/null
          }

          deploy_production() {
            local url
            url="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")"
            printf '%s' "$url"
          }

          case "$COMMAND" in
            "/vercel status")
              npx --yes vercel@latest env ls production --token "$VERCEL_TOKEN" >/tmp/vercel-env-list.txt
              comment "✅ Vercel connection succeeded for \`${RESOLVED_VERCEL_PROJECT_NAME:-$VERCEL_PROJECT_NAME}\`. Production environment variables are accessible. No settings were changed and no deployment was started."
              ;;

            "/vercel pilot-off")
              set_env AUTOPILOT_DISABLED true
              set_env OUTREACH_AUTO_SEND_ENABLED false
              set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
              set_env OUTREACH_DAILY_CAP 1
              set_env OUTREACH_EMAIL_DISABLED true
              url="$(deploy_production)"
              comment "✅ Outreach was disabled and production was redeployed. Daily cap remains 1. Deployment: ${url}"
              ;;

            "/vercel pilot-test CONFIRM")
              npx --yes vercel@latest env ls production --token "$VERCEL_TOKEN" >/tmp/vercel-env-list.txt
              required=(DATABASE_URL RESEND_API_KEY OUTREACH_FROM_EMAIL OUTREACH_REPLY_TO_EMAIL WEBWORKSHOP_POSTAL_ADDRESS)
              missing=()
              for key in "${required[@]}"; do
                grep -q "$key" /tmp/vercel-env-list.txt || missing+=("$key")
              done
              if (( ${#missing[@]} > 0 )); then
                comment "❌ Pilot was not enabled. Required Production variable name(s) are missing: \`${missing[*]}\`. No settings were changed."
                exit 1
              fi
              set_env AUTOPILOT_DISABLED false
              set_env OUTREACH_AUTO_SEND_ENABLED true
              set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
              set_env OUTREACH_DAILY_CAP 1
              set_env OUTREACH_EMAIL_DISABLED false
              set_env OUTREACH_SEND_PROVIDER resend
              url="$(deploy_production)"
              comment "✅ Reviewed Auto Email Pilot test mode was enabled with a daily cap of 1 and full-auto disabled. Production was redeployed: ${url}"
              ;;

            "/vercel redeploy")
              url="$(deploy_production)"
              comment "✅ Production was redeployed without changing environment variables: ${url}"
              ;;

            *)
              comment "❌ Command rejected. Allowed commands are: \`/vercel status\`, \`/vercel pilot-off\`, \`/vercel pilot-test CONFIRM\`, and \`/vercel redeploy\`."
              exit 1
              ;;
          esac
