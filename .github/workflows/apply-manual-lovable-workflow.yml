name: Apply manual Lovable workflow

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-lovable-preview-workflow
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply and verify manual Lovable workflow
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/run_manual_lovable_migration.py 2>&1 | tee manual-lovable-runner.log

      - name: Upload runner failure log
        if: steps.migration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: manual-lovable-runner-log
          path: manual-lovable-runner.log

      - name: Fail after captured runner error
        if: steps.migration.outcome == 'failure'
        run: exit 1
