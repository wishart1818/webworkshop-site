name: Apply manual Lovable workflow

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-lovable-preview-workflow
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply manual Lovable workflow changes
        id: migrate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/apply_manual_lovable_workflow.py 2>&1 | tee manual-lovable-migration.log

      - name: Upload migration failure log
        if: steps.migrate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: manual-lovable-migration-log
          path: manual-lovable-migration.log

      - name: Stop after migration failure
        if: steps.migrate.outcome == 'failure'
        run: exit 1

      - name: Run focused workflow tests
        run: npx tsx --test tests/manual-lovable-workflow.test.ts tests/autonomous-growth.test.ts tests/prospect-engine.test.ts tests/top-prospects.test.ts

      - name: Run full test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Remove temporary migration files
        run: rm -f .github/scripts/apply_manual_lovable_workflow.py .github/workflows/apply-manual-lovable-workflow.yml .github/manual-lovable-pr-marker.md .github/workflows/README-manual-lovable-migration.md .github/trigger-manual-lovable-pr.txt .github/README-manual-lovable-pr.md .github/pr-ready .github/STOP .github/final-trigger.txt manual-lovable-migration.log

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch outreach to manual Lovable preview workflow [manual-lovable-applied]"
          git push origin HEAD:feature/manual-lovable-preview-workflow
