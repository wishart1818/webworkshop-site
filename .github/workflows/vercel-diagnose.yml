name: Vercel Diagnose

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 3 &&
      github.actor == 'wishart1818' &&
      !github.event.issue.pull_request &&
      github.event.comment.body == '/diagnose-vercel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Link project and inspect production endpoint
        shell: bash
        run: |
          set -u
          npx --yes vercel@latest link --yes --project webworkshop-site --token "$VERCEL_TOKEN" >/tmp/link.log 2>&1

          set +e
          npx --yes vercel@latest curl /api/engine/autonomous-growth --token "$VERCEL_TOKEN" \
            --silent --show-error --include --output /tmp/response.txt 2>/tmp/request.err
          request_status=$?
          npx --yes vercel@latest logs --environment production --level error --since 15m --token "$VERCEL_TOKEN" \
            >/tmp/vercel-errors.txt 2>&1
          logs_status=$?
          set -e

          sanitize() {
            head -c 1200 "$1" 2>/dev/null \
              | tr '\r\n' '  ' \
              | sed -E 's/[[:space:]]+/ /g; s/`/'"'"'/g' \
              | sed -E 's/(Bearer|token|secret|password|api[_-]?key)[=: ]+[^ ]+/<redacted>/Ig'
          }

          response="$(sanitize /tmp/response.txt)"
          request_error="$(sanitize /tmp/request.err)"
          recent_errors="$(tail -c 1200 /tmp/vercel-errors.txt 2>/dev/null | tr '\r\n' '  ' | sed -E 's/[[:space:]]+/ /g; s/`/'"'"'/g; s/(Bearer|token|secret|password|api[_-]?key)[=: ]+[^ ]+/<redacted>/Ig')"

          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "### Vercel diagnostic
- Endpoint command exit: \`${request_status}\`
- Logs command exit: \`${logs_status}\`
- Endpoint response: \`${response:-empty}\`
- Request error: \`${request_error:-none}\`
- Recent production errors: \`${recent_errors:-none}\`

No settings were changed and no email was sent."
