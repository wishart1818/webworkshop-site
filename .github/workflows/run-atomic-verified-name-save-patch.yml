name: Run atomic verified name save patch

on:
  pull_request:
    branches:
      - fix/atomic-verified-name-save

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'tmp/atomic-verified-name-save-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/atomic-verified-name-save
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python .github/atomic-verified-name-save-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Commit verified patch
        run: |
          rm .github/atomic-verified-name-save-patch.py
          rm .github/workflows/run-atomic-verified-name-save-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/autonomous-growth-repository.ts tests/autonomous-growth.test.ts .github/atomic-verified-name-save-patch.py .github/workflows/run-atomic-verified-name-save-patch.yml
          git commit -m "Save verified names atomically"
          git push origin HEAD:fix/atomic-verified-name-save
