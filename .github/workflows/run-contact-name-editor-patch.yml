name: Run verified contact name editor patch

on:
  pull_request:
    branches:
      - fix/verified-contact-name-editor

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'tmp/contact-name-editor-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/verified-contact-name-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: |
          python .github/contact-name-editor-patch-fix.py
          python .github/contact-name-editor-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Commit verified patch
        run: |
          rm .github/contact-name-editor-patch.py
          rm .github/contact-name-editor-patch-fix.py
          rm .github/workflows/run-contact-name-editor-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/engine/autonomous-growth/route.ts lib/autonomous-growth-repository.ts components/engine/EmailDraftReviewHelper.tsx tests/autonomous-growth.test.ts tests/final-manual-workflow-audit.test.ts .github/contact-name-editor-patch.py .github/contact-name-editor-patch-fix.py .github/workflows/run-contact-name-editor-patch.yml
          git commit -m "Add verified contact name editor"
          git push origin HEAD:fix/verified-contact-name-editor
