name: Apply email review routing cleanup on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.head_ref == 'feat/email-review-routing-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/email-review-routing-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused routing changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-email-review-routing-cleanup.yml').read_text()
          marker = "          python <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, 'email-review-routing-patch.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Focused tests
        run: npx tsx --test tests/top-prospects.test.ts tests/manual-review-triage.test.ts tests/prospect-engine.test.ts tests/autonomous-growth.test.ts
      - name: Lint changed app surfaces
        run: npx eslint lib/prospect-engine.ts lib/prospect-review-routing.ts lib/top-prospects.ts lib/top-prospect-worker.ts lib/calls-queue.ts components/ProspectEngine.tsx components/engine/ProspectDetail.tsx
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/prospect-engine.ts lib/top-prospects.ts lib/top-prospect-worker.ts components/ProspectEngine.tsx components/engine/ProspectDetail.tsx
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "Add clean human-review email routing"
          git push origin HEAD:feat/email-review-routing-cleanup
