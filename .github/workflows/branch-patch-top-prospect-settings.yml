name: Branch patch Top Prospects settings

on:
  push:
    branches:
      - fix/top-prospect-settings-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/top-prospect-settings-persistence
          fetch-depth: 0
      - name: Patch workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/engine/TopProspectsWorkspace.tsx')
          text = path.read_text()

          old_import = 'import { autopilotCampaignDraftStorageKey, autopilotDraftFromRecommendedMarket, topProspectsAutopilotPrefillStorageKey, type AutopilotTopProspectsPrefill } from "@/lib/autopilot-campaign";\n'
          new_import = old_import + 'import { parseTopProspectFormSettings, topProspectSearchSettingsStorageKey } from "@/lib/top-prospect-form-settings";\n'
          if old_import not in text:
              raise SystemExit('autopilot import marker not found')
          text = text.replace(old_import, new_import, 1)

          old_ref = '  const cityInputRef = useRef<HTMLInputElement | null>(null);\n'
          new_ref = old_ref + '  const settingsHydratedRef = useRef(false);\n'
          if old_ref not in text:
              raise SystemExit('cityInputRef marker not found')
          text = text.replace(old_ref, new_ref, 1)

          marker = '''  useEffect(() => {\n    try {\n      const rawPrefill = window.localStorage.getItem(topProspectsAutopilotPrefillStorageKey);\n'''
          insert = '''  useEffect(() => {\n    if (!settingsHydratedRef.current) return;\n    try {\n      window.localStorage.setItem(topProspectSearchSettingsStorageKey, JSON.stringify({\n        prospectType: selectedProspectType,\n        mode: selectedMode,\n        workflowType: selectedWorkflow,\n        outreachPreference: selectedOutreachPreference,\n        trade: selectedTrade,\n        city: cityInput,\n        state: stateInput,\n        radiusKm: selectedRadiusKm,\n        businessesToScan,\n        finalProspectsWanted,\n        excludePreviouslyReviewed,\n      }));\n    } catch {\n      // The search form remains usable when browser storage is unavailable.\n    }\n  }, [\n    businessesToScan,\n    cityInput,\n    excludePreviouslyReviewed,\n    finalProspectsWanted,\n    selectedMode,\n    selectedOutreachPreference,\n    selectedProspectType,\n    selectedRadiusKm,\n    selectedTrade,\n    selectedWorkflow,\n    stateInput,\n  ]);\n\n  useEffect(() => {\n    try {\n      const saved = parseTopProspectFormSettings(window.localStorage.getItem(topProspectSearchSettingsStorageKey));\n      if (!saved) return;\n      if (saved.prospectType) setSelectedProspectType(saved.prospectType);\n      if (saved.mode) setSelectedMode(saved.mode);\n      if (saved.workflowType) setSelectedWorkflow(saved.workflowType);\n      if (saved.outreachPreference) setSelectedOutreachPreference(saved.outreachPreference);\n      if (saved.trade) setSelectedTrade(saved.trade);\n      if (typeof saved.city === "string") setCityInput(saved.city);\n      if (saved.state) setStateInput(saved.state);\n      if (saved.radiusKm) setSelectedRadiusKm(saved.radiusKm);\n      if (saved.businessesToScan) setBusinessesToScan(saved.businessesToScan);\n      if (saved.finalProspectsWanted) setFinalProspectsWanted(saved.finalProspectsWanted);\n      if (typeof saved.excludePreviouslyReviewed === "boolean") setExcludePreviouslyReviewed(saved.excludePreviouslyReviewed);\n    } catch {\n      // Ignore malformed or unavailable local saved settings.\n    } finally {\n      settingsHydratedRef.current = true;\n    }\n  }, []);\n\n'''
          if marker not in text:
              raise SystemExit('autopilot prefill effect marker not found')
          text = text.replace(marker, insert + marker, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/branch-patch-top-prospect-settings.yml')
          workflow.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/engine/TopProspectsWorkspace.tsx .github/workflows/branch-patch-top-prospect-settings.yml
          git commit -m "Persist Top Prospects search settings"
          git push origin HEAD:fix/top-prospect-settings-persistence
