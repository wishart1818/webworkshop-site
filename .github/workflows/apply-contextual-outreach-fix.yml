name: Apply contextual outreach integration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-contextual-outreach-fix.yml
  push:
    branches:
      - fix/contextual-outreach-v4
    paths:
      - .github/workflows/apply-contextual-outreach-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contextual-outreach-v4
          fetch-depth: 0

      - name: Patch remaining shared paths and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          autonomous_path = "lib/autonomous-growth.ts"
          autonomous = read(autonomous_path)
          rewrite_pattern = re.compile(
              r'^export function rewriteOutreachWithFixes\(emailBody: string\) \{.*?^\}',
              re.MULTILINE | re.DOTALL,
          )
          rewrite_replacement = '''export function rewriteOutreachWithFixes(emailBody: string) {
            const optOut = emailBody.match(/Thanks,[\\s\\S]*?(?:If you would rather not receive another note, just reply and I will close the loop\\.|If you'd rather not hear from me again, just let me know\\.)/i)?.[0]
              ?? outreachComplianceFooter();
            const lines = emailBody.split("\\n").map((line) => line.trim()).filter(Boolean);
            const greeting = lines.find((line) => /^Hi\\b/i.test(line)) ?? "Hi there,";
            const contextualOpening = lines.find((line) => /^I came across\\b/i.test(line))
              ?? "I came across your business.";
            return [
              greeting,
              "",
              contextualOpening,
              "",
              "I had a simple website idea that could make it easier for people to see what you do and call or request a quote.",
              "",
              "Would you like me to put together a quick preview?",
              "",
              optOut,
            ].join("\\n");
          }'''
          autonomous, rewrite_count = rewrite_pattern.subn(lambda _match: rewrite_replacement, autonomous, count=1)
          if rewrite_count != 1:
              raise SystemExit(f"Expected one rewriteOutreachWithFixes function, found {rewrite_count}")
          write(autonomous_path, autonomous)

          operator_path = "lib/operator-test-center.ts"
          operator = read(operator_path)
          readiness_line = (
              '  const firstEmailHasApprovedReason = /I came across '
              '(?:your [^.]+ business(?: while looking at companies around [^.]+)?|your business(?: while looking at companies around [^.]+)?)\\.'
              '[\\s\\S]+(?:couldn\'t find a dedicated website|had an idea for a simpler website direction)'
              '[\\s\\S]+Would you like me to put together a quick preview\\?/i.test(firstEmail);'
          )
          operator, readiness_count = re.subn(
              r'^  const firstEmailHasApprovedReason = .*?;$',
              lambda _match: readiness_line,
              operator,
              count=1,
              flags=re.MULTILINE,
          )
          if readiness_count != 1:
              raise SystemExit(f"Expected one firstEmailHasApprovedReason line, found {readiness_count}")
          write(operator_path, operator)

          autonomous_test_path = "tests/autonomous-growth.test.ts"
          autonomous_test = read(autonomous_test_path)
          autonomous_test = autonomous_test.replace(
              '    "I came across your business.",',
              '    "I came across your pressure washing business while looking at companies around Tampa, FL.",',
          )
          contextual_fixture = '    "I came across your roofing business while looking at companies around Toledo.",\n    "",\n'
          marker = '    "This free audit could transform your seamless web presence.",\n'
          if contextual_fixture not in autonomous_test:
              if marker not in autonomous_test:
                  raise SystemExit("Could not find rewrite outreach fixture marker")
              autonomous_test = autonomous_test.replace(marker, contextual_fixture + marker, 1)
          assertion = '  assert.match(rewritten, /roofing business while looking at companies around Toledo/i);\n'
          assertion_marker = '  assert.match(rewritten, /make it easier for people to see what you do and call or request a quote/i);\n'
          if assertion not in autonomous_test:
              if assertion_marker not in autonomous_test:
                  raise SystemExit("Could not find rewrite outreach assertion marker")
              autonomous_test = autonomous_test.replace(assertion_marker, assertion_marker + assertion, 1)
          autonomous_test = autonomous_test.replace("manual_lovable_permission_first_v3", "manual_lovable_permission_first_v4")
          write(autonomous_test_path, autonomous_test)

          operator_test_path = "tests/operator-test-center.test.ts"
          operator_test = read(operator_test_path)
          operator_test = operator_test.replace(
              '      "I came across your business.",',
              '      "I came across your pressure washing business while looking at companies around Tampa, FL.",',
          )
          operator_test = operator_test.replace("manual_lovable_permission_first_v3", "manual_lovable_permission_first_v4")
          write(operator_test_path, operator_test)

          top_test_path = "tests/top-prospects.test.ts"
          top_test = read(top_test_path)
          old_replacement = '/I came across your business\\./,'
          new_replacement = '/I came across[^.]+\\./,'
          if old_replacement in top_test:
              top_test = top_test.replace(old_replacement, new_replacement, 1)
          elif new_replacement not in top_test:
              raise SystemExit("Could not find Top Prospects unsafe-copy replacement")
          top_test = top_test.replace("manual_lovable_permission_first_v3", "manual_lovable_permission_first_v4")
          write(top_test_path, top_test)

          for path in Path("tests").rglob("*.ts"):
              value = path.read_text(encoding="utf-8")
              updated = value.replace("manual_lovable_permission_first_v3", "manual_lovable_permission_first_v4")
              if updated != value:
                  path.write_text(updated, encoding="utf-8")

          Path(".github/workflows/apply-contextual-outreach-fix.yml").unlink()
          PY

      - name: Commit contextual integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete contextual outreach integration"
          git push origin HEAD:fix/contextual-outreach-v4
