name: Temporary review reporting and copy polish

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/review-reporting-and-short-copy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "lib/outreach-style-guide.ts",
              'export const WEBWORKSHOP_OUTREACH_COPY_VERSION = "verified_rebuild_permission_first_v8";',
              'export const WEBWORKSHOP_OUTREACH_COPY_VERSION = "verified_rebuild_permission_first_v9";',
          )
          replace_once(
              "lib/outreach-style-guide.ts",
              'export function webworkshopOptOutLine() {\n  return "If you\'d rather not hear from me again, just let me know.";\n}',
              'export const webworkshopReviewPermissionCta = "Would you be open to me putting together a quick website concept around your current services and branding?";\n\nexport function webworkshopOptOutLine() {\n  return "If you\'d rather not hear from me again, just let me know.";\n}',
          )
          replace_once(
              "lib/outreach-style-guide.ts",
              '  const optionalFact = factualMiddleLine?.trim() && factualMiddleLine.trim() !== valueLine\n    ? factualMiddleLine.trim()\n    : "";\n\n  return [',
              '  const optionalFact = factualMiddleLine?.trim() && factualMiddleLine.trim() !== valueLine\n    ? factualMiddleLine.trim()\n    : "";\n  const valueLineIsPermissionCta = valueLine === webworkshopReviewPermissionCta;\n\n  return [',
          )
          replace_once(
              "lib/outreach-style-guide.ts",
              '    valueLine,\n    "",\n    "Would you be interested in seeing what that could look like?",',
              '    valueLine,\n    "",\n    valueLineIsPermissionCta ? "" : "Would you be interested in seeing what that could look like?",',
          )

          replace_once(
              "lib/prospect-review-routing.ts",
              'import type { Prospect, WebsiteFitObservation } from "@/lib/prospect-engine";',
              'import type { Prospect, WebsiteFitObservation } from "@/lib/prospect-engine";\nimport { webworkshopReviewPermissionCta } from "@/lib/outreach-style-guide";',
          )
          replace_once(
              "lib/prospect-review-routing.ts",
              '        statement: "I took a look at your website and had a couple of ideas around making the customer contact or quote path a little clearer.",\n        rebuildSentence: "I can rebuild your current website with a more focused contact and quote path while keeping your services and contact information easy for customers to find.",',
              '        statement: "I took a look at your website and had a couple ideas for making it easier for customers to get in touch and request an estimate.",\n        rebuildSentence: webworkshopReviewPermissionCta,',
          )
          replace_once(
              "lib/prospect-review-routing.ts",
              '          statement: "I took a look at your website and had a couple of ideas around making the next step for customers a little clearer.",\n          rebuildSentence: "I can rebuild your current website with clearer calls to action and an easier path to contact the business or request a quote.",',
              '          statement: "I took a look at your website and had a couple ideas for making the next step a little clearer for customers.",\n          rebuildSentence: webworkshopReviewPermissionCta,',
          )
          replace_once(
              "lib/prospect-review-routing.ts",
              '          statement: "I took a look at your website and had a couple of ideas around simplifying the path from service information to getting in touch.",\n          rebuildSentence: "I can rebuild your current website with a clearer path from service details to contacting the business or requesting a quote.",',
              '          statement: "I took a look at your website and had a couple ideas for making it easier for customers to move from your services to getting in touch.",\n          rebuildSentence: webworkshopReviewPermissionCta,',
          )

          replace_once(
              "lib/top-prospects.ts",
              'import { webworkshopOptOutPattern } from "@/lib/outreach-style-guide";',
              'import { webworkshopOptOutPattern, webworkshopReviewPermissionCta } from "@/lib/outreach-style-guide";',
          )
          replace_once(
              "lib/top-prospects.ts",
              '  job: Pick<TopProspectJob, "results" | "manualOpportunityProspects" | "skipSummary" | "skippedCount">,\n) {\n  const strictlyQualified = job.results.length;\n  const manualReview = job.manualOpportunityProspects?.length ?? 0;',
              '  job: Pick<TopProspectJob, "results" | "reviewableLowerPriority" | "manualOpportunityProspects" | "skipSummary" | "skippedCount">,\n) {\n  const strictlyQualified = job.results.length;\n  const manualReview = (job.manualOpportunityProspects?.length ?? 0) + (job.reviewableLowerPriority?.length ?? 0);',
          )
          replace_once(
              "lib/top-prospects.ts",
              '  const permissionCtaReady = /would you be interested in seeing what that could look like\\?/i.test(firstTouch);',
              '  const permissionCtaReady = /would you be interested in seeing what that could look like\\?/i.test(firstTouch)\n    || firstTouch.toLowerCase().includes(webworkshopReviewPermissionCta.toLowerCase());',
          )

          replace_once(
              "tests/outreach-style-guide.test.ts",
              'assert.equal(WEBWORKSHOP_OUTREACH_COPY_VERSION, "verified_rebuild_permission_first_v8");',
              'assert.equal(WEBWORKSHOP_OUTREACH_COPY_VERSION, "verified_rebuild_permission_first_v9");',
          )
          replace_once(
              "tests/prospect-engine.test.ts",
              '  assert.match(outreach.concise, /had a couple of ideas/i);\n  assert.match(outreach.concise, /contact|quote/i);',
              '  assert.match(outreach.concise, /had a couple ideas/i);\n  assert.match(outreach.concise, /contact|estimate/i);\n  assert.match(outreach.concise, /Would you be open to me putting together a quick website concept around your current services and branding\\?/i);\n  assert.doesNotMatch(outreach.concise, /I can rebuild your current website/i);\n  assert.doesNotMatch(outreach.concise, /Would you be interested in seeing what that could look like\\?/i);',
          )
          replace_once(
              "tests/manual-opportunity-review.test.ts",
              '    results: [{} as never, {} as never],\n    manualOpportunityProspects: [manualRecord],\n    skipSummary: { previously_reviewed: 3, manual_opportunity: 1, confirmed_usable_website_not_fit: 4 },\n    skippedCount: 9,\n  });\n\n  assert.deepEqual(counts, { strictlyQualified: 2, manualReview: 1, previouslyReviewed: 3, skipped: 5 });',
              '    results: [{} as never, {} as never],\n    reviewableLowerPriority: [{} as never],\n    manualOpportunityProspects: [manualRecord],\n    skipSummary: { previously_reviewed: 3, manual_opportunity: 1, confirmed_usable_website_not_fit: 4 },\n    skippedCount: 9,\n  });\n\n  assert.deepEqual(counts, { strictlyQualified: 2, manualReview: 2, previouslyReviewed: 3, skipped: 4 });',
          )
          PY

      - name: Install dependencies
        run: npm ci
      - name: Focused tests
        run: node --import tsx --test tests/outreach-style-guide.test.ts tests/prospect-engine.test.ts tests/manual-opportunity-review.test.ts
      - name: Diff check
        run: git diff --check
      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/outreach-style-guide.ts lib/prospect-review-routing.ts lib/top-prospects.ts tests/outreach-style-guide.test.ts tests/prospect-engine.test.ts tests/manual-opportunity-review.test.ts
          git commit -m "Polish review counts and first-touch copy"
          git push origin HEAD:fix/review-reporting-and-short-copy
