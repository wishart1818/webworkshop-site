name: Top Prospects Continuation

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top-prospects-continuation
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Derive Top Prospects scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN is not configured; Top Prospects continuation remains fail-closed."
            exit 1
          fi
          TOP_PROSPECT_CRON_SECRET="$(printf 'webworkshop-top-prospects:%s' "$VERCEL_TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$TOP_PROSPECT_CRON_SECRET"
          printf 'TOP_PROSPECT_CRON_SECRET=%s\n' "$TOP_PROSPECT_CRON_SECRET" >> "$GITHUB_ENV"

      - name: Pulse persisted Top Prospects job every five minutes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 7); do
            started_at="$(date +%s)"
            response="$(curl --location --fail-with-body --silent --show-error --max-time 295 \
              -H "Authorization: Bearer $TOP_PROSPECT_CRON_SECRET" \
              https://www.webworkshop.dev/api/cron/top-prospects)"
            printf 'Top Prospects pulse %s/7: %s\n' "$attempt" "$response"
            printf '%s' "$response" | grep -q '"ok":true'

            if [[ "$attempt" -lt 7 ]]; then
              elapsed=$(( $(date +%s) - started_at ))
              delay=$(( 300 - elapsed ))
              if (( delay > 0 )); then
                sleep "$delay"
              fi
            fi
          done
