name: Top Prospects Continuation

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top-prospects-continuation
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: webworkshop-site
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN is not configured; Top Prospects continuation remains fail-closed."
            exit 1
          fi

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/dev/null

      - name: Load production cron secret
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env pull /tmp/webworkshop-production.env --environment=production --git-branch=main --yes --token "$VERCEL_TOKEN" >/dev/null
          set -a
          source /tmp/webworkshop-production.env
          set +a
          CRON_SECRET="$(printf '%s' "${CRON_SECRET:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET is missing; Top Prospects continuation remains fail-closed."
            exit 1
          fi
          echo "::add-mask::$CRON_SECRET"
          printf 'CRON_SECRET=%s\n' "$CRON_SECRET" >> "$GITHUB_ENV"

      - name: Pulse persisted Top Prospects job every five minutes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 7); do
            started_at="$(date +%s)"
            response="$(curl --location --fail-with-body --silent --show-error --max-time 295 \
              -H "Authorization: Bearer $CRON_SECRET" \
              https://www.webworkshop.dev/api/cron/top-prospects)"
            printf 'Top Prospects pulse %s/7: %s\n' "$attempt" "$response"
            printf '%s' "$response" | grep -q '"ok":true'

            if [[ "$attempt" -lt 7 ]]; then
              elapsed=$(( $(date +%s) - started_at ))
              delay=$(( 300 - elapsed ))
              if (( delay > 0 )); then
                sleep "$delay"
              fi
            fi
          done
