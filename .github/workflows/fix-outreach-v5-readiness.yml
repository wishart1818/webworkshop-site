name: Fix outreach v5 readiness

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.base.ref == 'fix/outreach-v5-clear-offer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outreach-v5-clear-offer
          fetch-depth: 0

      - name: Update yes-reply readiness gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("lib/operator-test-center.ts")
          text = path.read_text()
          old = "/I'll put together a quick preview/i.test(yesReply)"
          new = "/I'll put together a website concept and send you a quick video walkthrough/i.test(yesReply)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one stale yes-reply readiness check, found {count}")
          path.write_text(text.replace(old, new))
          PY

      - name: Commit and remove helper
        shell: bash
        run: |
          rm .github/workflows/fix-outreach-v5-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/operator-test-center.ts .github/workflows/fix-outreach-v5-readiness.yml
          git commit -m "Align readiness yes-reply check with v5 workflow"
          git push origin HEAD:fix/outreach-v5-clear-offer
