name: Vercel Command

on:
  push:
    branches:
      - main
    paths:
      - .github/vercel-command.json

permissions:
  contents: read
  issues: write

concurrency:
  group: webworkshop-vercel-command
  cancel-in-progress: true

jobs:
  run-command:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read command
        shell: bash
        run: |
          set -euo pipefail
          command="$(node -e 'const c=require("./.github/vercel-command.json"); process.stdout.write(String(c.command||""))')"
          nonce="$(node -e 'const c=require("./.github/vercel-command.json"); process.stdout.write(String(c.nonce||""))')"
          echo "COMMAND=$command" >> "$GITHUB_ENV"
          echo "COMMAND_NONCE=$nonce" >> "$GITHUB_ENV"

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project webworkshop-site --token "$VERCEL_TOKEN" >/tmp/vercel-link.log 2>&1
          npx --yes vercel@latest project inspect --token "$VERCEL_TOKEN" >/dev/null

      - name: Execute command
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMMAND" != "diagnose" ]]; then
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "Unknown push-triggered Vercel command. No settings were changed."
            exit 1
          fi

          set +e
          npx --yes vercel@latest curl --token "$VERCEL_TOKEN" /api/health/autopilot >/tmp/response.txt 2>/tmp/request.err
          status=$?
          set -e

          response="empty"
          request_error="none"
          if [[ -s /tmp/response.txt ]]; then
            response="$(head -c 1200 /tmp/response.txt | tr '\r\n' ' ' | sed -E 's/[[:space:]]+/ /g')"
          fi
          if [[ -s /tmp/request.err ]]; then
            request_error="$(head -c 800 /tmp/request.err | tr '\r\n' ' ' | sed -E 's/[[:space:]]+/ /g')"
          fi

          body="Vercel health diagnostic nonce ${COMMAND_NONCE}. Endpoint exit ${status}. Response: ${response}. Request error: ${request_error}. No settings were changed and no email was sent."
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$body"
