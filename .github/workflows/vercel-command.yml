name: Vercel Command

on:
  push:
    branches:
      - main
    paths:
      - .github/vercel-command.json

permissions:
  contents: read
  issues: write

concurrency:
  group: webworkshop-vercel-command
  cancel-in-progress: true

jobs:
  run-command:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read command
        shell: bash
        run: |
          set -euo pipefail
          command="$(node -e 'const c=require("./.github/vercel-command.json"); process.stdout.write(String(c.command||""))')"
          nonce="$(node -e 'const c=require("./.github/vercel-command.json"); process.stdout.write(String(c.nonce||""))')"
          echo "COMMAND=$command" >> "$GITHUB_ENV"
          echo "COMMAND_NONCE=$nonce" >> "$GITHUB_ENV"

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project webworkshop-site --token "$VERCEL_TOKEN" >/tmp/vercel-link.log 2>&1
          npx --yes vercel@latest project inspect --token "$VERCEL_TOKEN" >/dev/null

      - name: Execute command
        shell: bash
        run: |
          set -euo pipefail

          post_result() {
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$1"
          }

          compact_file() {
            local file="$1"
            local fallback="$2"
            if [[ -s "$file" ]]; then
              head -c 1600 "$file" | tr '\r\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/`/'"'"'/g'
            else
              printf '%s' "$fallback"
            fi
          }

          fail() {
            post_result "Auto Email Pilot ${COMMAND} check failed. Outreach remains disabled and no prospect email was intentionally sent."
            exit 1
          }

          case "$COMMAND" in
            health)
              npx --yes vercel@latest curl /api/health/autopilot >/tmp/result.json 2>/tmp/result.err || fail
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/result.json","utf8")); if (!(d.ok===true && d.failClosed===true && d.databaseConnected===true && d.requiredEnvironmentReady===true && d.queueReadable===true)) process.exit(1)' || fail
              post_result "Auto Email Pilot health check passed for nonce ${COMMAND_NONCE}: Production environment, database, and queue are healthy; outreach is fail-closed."
              ;;

            tests)
              npm ci >/tmp/npm-ci.log 2>&1 || fail
              npx tsx --test tests/autonomous-growth.test.ts >/tmp/focused-tests.log 2>&1 || fail
              passed="$(grep -Eo '[0-9]+ passed' /tmp/focused-tests.log | tail -1 || true)"
              post_result "Auto Email Pilot focused safety tests passed for nonce ${COMMAND_NONCE}${passed:+: ${passed}}. Outreach remains disabled."
              ;;

            smoke)
              set +e
              npx --yes vercel@latest curl /api/engine/autonomous-growth -X POST -H "Content-Type: application/json" -d '{"action":"run_fake_autopilot_smoke_test"}' >/tmp/result.json 2>/tmp/result.err
              request_status=$?
              set -e
              response="$(compact_file /tmp/result.json empty)"
              request_error="$(compact_file /tmp/result.err none)"
              if [[ "$request_status" != "0" ]]; then
                post_result "Auto Email Pilot smoke request failed for nonce ${COMMAND_NONCE}. Exit ${request_status}. Response: ${response}. Error: ${request_error}. Outreach remains disabled and no prospect email was intentionally sent."
                exit 1
              fi
              set +e
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/result.json","utf8")); const r=d.smokeTest||d.autopilotSmokeTest||d; if (r?.passed!==true) process.exit(1)'
              assertion_status=$?
              set -e
              if [[ "$assertion_status" != "0" ]]; then
                post_result "Auto Email Pilot smoke assertions failed for nonce ${COMMAND_NONCE}. Production response: ${response}. Outreach remains disabled and no prospect email was intentionally sent."
                exit 1
              fi
              post_result "Auto Email Pilot fake production pipeline passed for nonce ${COMMAND_NONCE}. No real email was sent and outreach remains disabled."
              ;;

            provider)
              cat >/tmp/provider-test.mjs <<'NODE'
          import fs from 'node:fs';
          const required = ['RESEND_API_KEY', 'OUTREACH_FROM_EMAIL', 'OUTREACH_REPLY_TO_EMAIL'];
          if (required.some((key) => !String(process.env[key] || '').trim())) throw new Error('Provider variables are missing.');
          const recipient = process.env.OUTREACH_REPLY_TO_EMAIL.trim();
          const response = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.RESEND_API_KEY.trim()}`,
              'Content-Type': 'application/json',
              'Idempotency-Key': `webworkshop-controlled-verification-${process.env.GITHUB_RUN_ID}`,
            },
            body: JSON.stringify({
              from: process.env.OUTREACH_FROM_EMAIL.trim(),
              to: [recipient],
              reply_to: recipient,
              subject: '[WebWorkshop] Auto Email Pilot delivery test',
              text: 'This controlled verification was sent only to the configured WebWorkshop operator inbox. No prospect was contacted.',
            }),
          });
          if (!response.ok) throw new Error(`Resend returned HTTP ${response.status}.`);
          const payload = await response.json();
          if (typeof payload?.id !== 'string' || !payload.id.trim()) throw new Error('Resend did not return a valid message ID.');
          fs.writeFileSync('/tmp/provider-result.json', JSON.stringify({ id: payload.id.trim() }));
          NODE
              npx --yes vercel@latest env run -e production -- node /tmp/provider-test.mjs >/tmp/provider-test.log 2>&1 || fail
              provider_id="$(node -e 'const r=require("/tmp/provider-result.json"); process.stdout.write(r.id)')"
              post_result "Controlled Resend delivery passed for nonce ${COMMAND_NONCE}. The message was sent only to the configured operator inbox; no prospect was contacted. Provider message ID: ${provider_id}. Outreach remains disabled."
              ;;

            security)
              node - <<'NODE' || fail
          const fs = require('fs');
          const linked = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          const params = new URLSearchParams({ projectId: linked.projectId, target: 'production', limit: '1' });
          if (String(linked.orgId || '').startsWith('team_')) params.set('teamId', linked.orgId);
          const response = await fetch(`https://api.vercel.com/v6/deployments?${params}`, { headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
          if (!response.ok) process.exit(1);
          const payload = await response.json();
          const url = payload?.deployments?.[0]?.url;
          if (!url) process.exit(1);
          fs.writeFileSync('/tmp/production-url.txt', `https://${url}`);
          NODE
              production_url="$(cat /tmp/production-url.txt)"
              public_code="$(curl -sS -o /tmp/public-probe.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"action":"security_probe"}' "${production_url}/api/engine/autonomous-growth" || true)"
              if [[ "$public_code" == "401" || "$public_code" == "403" ]]; then
                status="protected"
              else
                status="public"
              fi
              post_result "Auto Email Pilot external mutation security probe for nonce ${COMMAND_NONCE}: ${status} (HTTP ${public_code}). The probe used an unsupported no-op action; no data changed and no email was sent."
              ;;

            *)
              post_result "Unknown Auto Email Pilot verification command. No settings were changed."
              exit 1
              ;;
          esac
