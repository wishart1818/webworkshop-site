name: Cron Health Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/.cron-health-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: webworkshop-cron-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: webworkshop-site
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Link project and load production environment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@latest env pull /tmp/webworkshop-production.env --environment=production --yes --token "$VERCEL_TOKEN" >/dev/null
          set -a
          source /tmp/webworkshop-production.env
          set +a
          if [[ -z "${CRON_SECRET:-}" ]]; then
            gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "❌ Cron health failed: CRON_SECRET is missing. Outreach remains disabled."
            exit 1
          fi

      - name: Force fail-closed production settings
        shell: bash
        run: |
          set -euo pipefail
          set_env() {
            printf '%s' "$2" | npx --yes vercel@latest env add "$1" production --force --token "$VERCEL_TOKEN" >/dev/null
          }
          set_env AUTOPILOT_DISABLED true
          set_env OUTREACH_AUTO_SEND_ENABLED false
          set_env OUTREACH_FULL_AUTO_SEND_ENABLED false
          set_env OUTREACH_DAILY_CAP 1
          set_env OUTREACH_EMAIL_DISABLED true

      - name: Deploy and verify cron endpoint
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /tmp/webworkshop-production.env
          set +a

          deploy_output="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1)"
          url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n1)"
          if [[ -z "$url" ]]; then
            safe="$(printf '%s' "$deploy_output" | tail -c 1200 | tr '\r\n' '  ')"
            gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "❌ Cron health could not determine the production deployment URL. Outreach remains disabled. Output: \`$safe\`"
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${url}/api/cron/autopilot" 2>&1)" || status=$?
          status="${status:-0}"
          safe_response="$(printf '%s' "$response" | head -c 1200 | tr '\r\n' '  ' | sed -E 's/[[:space:]]+/ /g; s/`/'"'"'/g')"

          if [[ "$status" -eq 0 ]] && grep -q '"ok":true' <<<"$response" && grep -q '"sent":0' <<<"$response"; then
            gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "✅ Cron health passed. Authentication worked, the real scheduled processing path completed, and zero emails were sent while outreach remained disabled. Daily cap remains 1. Deployment: ${url}. Probe: \`${safe_response}\`"
          else
            gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "❌ Cron health failed safely. Outreach remains disabled and the daily cap remains 1. Deployment: ${url}. Probe: \`${safe_response:-empty}\`"
            exit 1
          fi
