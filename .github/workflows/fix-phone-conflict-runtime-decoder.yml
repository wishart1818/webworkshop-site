name: Fix phone-conflict runtime decoder

on:
  push:
    branches:
      - fix/phone-conflict-runtime-decoder
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/phone-conflict-runtime-decoder

      - name: Patch runtime decoder
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/prospect-validation.ts")
          text = path.read_text()
          if '    "public_phone_conflict",' in text:
              raise SystemExit(0)
          needle = '    "business_domain_email_match",'
          if needle not in text:
              raise SystemExit("Expected business-domain identity signal was not found.")
          path.write_text(text.replace(needle, needle + '\n    "public_phone_conflict",', 1))

      - name: Commit patch
        run: |
          if git diff --quiet -- lib/prospect-validation.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/prospect-validation.ts
          git diff --cached --check
          git commit -m "Accept phone conflict in runtime decoder"
          git push origin HEAD:fix/phone-conflict-runtime-decoder
