name: Complete manual Lovable workflow

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  complete-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-lovable-preview-workflow
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply workflow changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize_manual_lovable_workflow.py
          python3 .github/scripts/complete_manual_lovable.py

      - name: Run focused tests
        run: npx tsx --test tests/approval-feedback.test.ts tests/manual-lovable-workflow.test.ts tests/autonomous-growth.test.ts tests/prospect-engine.test.ts tests/top-prospects.test.ts tests/preview-render-plan.test.ts

      - name: Run full test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Remove temporary migration files
        run: |
          rm -f .github/scripts/finalize_manual_lovable_workflow.py
          rm -f .github/scripts/complete_manual_lovable.py
          rm -f .github/workflows/finalize-manual-lovable-workflow.yml
          rm -f .github/workflows/complete-manual-lovable.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete manual Lovable outreach workflow [manual-lovable-complete]"
          git push origin HEAD:feature/manual-lovable-preview-workflow
