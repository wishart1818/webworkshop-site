name: Fix outreach v5 CI

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.base.ref == 'fix/outreach-v5-clear-offer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outreach-v5-clear-offer
          fetch-depth: 0

      - name: Patch v5 quality gates and assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int | None = None):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:90]!r}")
              if count:
                  file.write_text(text.replace(old, new))
              print(f"{path}: {count} replacement(s)")

          replace(
              "lib/top-prospects.ts",
              "  const permissionCtaReady = /would you like me to (?:put together|create|make|build)(?: you)? (?:a )?(?:quick )?(?:website )?preview\\?/i.test(firstTouch);",
              "  const permissionCtaReady = /would you be interested in seeing what that could look like\\?/i.test(firstTouch);",
              expected=1,
          )
          replace(
              "lib/top-prospects.ts",
              "  const relevantReasonReady = /couldn't find a dedicated website|website direction|website idea|easier for people to (?:see|call|request)|call or request a quote/i.test(firstTouch);",
              "  const relevantReasonReady = /I can build you a refreshed, more modern website designed to help bring in more calls and quote requests\\./i.test(firstTouch)\n    || /It looks like you don't currently have a full website up\\. I can build you a modern one designed to help bring in more calls and quote requests\\./i.test(firstTouch);",
              expected=1,
          )

          replace("tests/autonomous-growth.test.ts", "assert.match(playbook.sendAfterLoom, /Loom walkthrough/);", "assert.match(playbook.sendAfterLoom, /Video walkthrough:/);", expected=1)
          replace("tests/autonomous-growth.test.ts", "assert.match(playbook.sendAfterLoom, /Preview:/);", "assert.match(playbook.sendAfterLoom, /Website:/);", expected=1)
          replace("tests/autonomous-growth.test.ts", "assert.match(playbook.pricingReply, /\\$1,000 total/);", "assert.match(playbook.pricingReply, /one-time price is \\$1,000/);", expected=1)
          replace("tests/autonomous-growth.test.ts", "assert.match(task.scripts.sendAfterLoom, /Preview:/);", "assert.match(task.scripts.sendAfterLoom, /Website:/);", expected=1)

          replace(
              "tests/operator-test-center.test.ts",
              "assert.match(fake?.fullSummary ?? \"\", /easier for people to see what you do and call or request a quote/i);",
              "assert.match(fake?.fullSummary ?? \"\", /refreshed, more modern website designed to help bring in more calls and quote requests/i);",
              expected=1,
          )
          replace(
              "tests/operator-test-center.test.ts",
              "assert.match(repairedCopy?.emailBody ?? \"\", /^Hi Ready Pressure Washing team,/);",
              "assert.match(repairedCopy?.emailBody ?? \"\", /^Hi there,/);",
              expected=1,
          )

          replace(
              "tests/final-manual-workflow-audit.test.ts",
              'concise: current.concise.replace("Would you like me to put together a quick preview?", "Want me to send it over?"),',
              'concise: current.concise.replace("Would you be interested in seeing what that could look like?", "Want me to send it over?"),',
              expected=1,
          )
          replace(
              "tests/final-manual-workflow-audit.test.ts",
              'concise: current.concise.replace(/I had an idea[^.]*\\./i, "I built a website preview for the business."),',
              'concise: current.concise.replace(/I can build you a refreshed, more modern website designed to help bring in more calls and quote requests\\.|It looks like you don\'t currently have a full website up\\. I can build you a modern one designed to help bring in more calls and quote requests\\./i, "I built a website preview for the business."),',
              expected=1,
          )
          PY

      - name: Commit fixes and remove helper
        shell: bash
        run: |
          rm .github/workflows/fix-outreach-v5-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib tests .github/workflows/fix-outreach-v5-ci.yml
          git commit -m "Align outreach quality gates with v5 copy"
          git push origin HEAD:fix/outreach-v5-clear-offer
