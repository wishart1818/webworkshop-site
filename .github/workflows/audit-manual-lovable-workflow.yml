name: Audit manual Lovable workflow

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-lovable-preview-workflow
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply audit fixes
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/scripts/audit_manual_lovable_workflow.py')
          source = path.read_text(encoding='utf-8')

          old_status = """# Protect every post-interest workflow state from copy regeneration.
          replace_once(
              "lib/autonomous-growth.ts",
              '''  "Preview Build Needed",
            "Loom Needed",''',
              '''  "Preview Build Needed",
            "Preview Needs Polish",
            "Loom Needed",''',
              "post-interest protected status",
          )"""
          new_status = """# Protect every post-interest workflow state from copy regeneration.
          replace_regex(
              "lib/autonomous-growth.ts",
              r'''(const contactedOrClosedStatuses = new Set<OutreachQueueStatus>\\(\\[[\\s\\S]*?  "Preview Build Needed",\\n)(  "Loom Needed",)''',
              r'''\\1  "Preview Needs Polish",\\n\\2''',
              "post-interest protected status",
          )"""
          if source.count(old_status) != 1:
              raise SystemExit(f'Targeted protected-status transform count: {source.count(old_status)}')
          source = source.replace(old_status, new_status, 1)

          old_daily = """replace_once(
              "lib/autonomous-growth-repository.ts",
              '''  const sentToday = queue.filter((item) => item.sentDate && new Date(item.sentDate) >= todayStart()).length;''',
              '''  const sentToday = emailsSentOnCurrentBusinessDate(queue);''',
              "pilot cycle daily count",
          )"""
          new_daily = """daily_count_path = "lib/autonomous-growth-repository.ts"
          daily_count_source = read(daily_count_path)
          old_daily_count = '''  const sentToday = queue.filter((item) => item.sentDate && new Date(item.sentDate) >= todayStart()).length;'''
          new_daily_count = '''  const sentToday = emailsSentOnCurrentBusinessDate(queue);'''
          daily_count_matches = daily_count_source.count(old_daily_count)
          if daily_count_matches != 2:
              raise SystemExit(f"Expected two scheduled/full-auto daily count targets, found {daily_count_matches}.")
          write(daily_count_path, daily_count_source.replace(old_daily_count, new_daily_count))"""
          if source.count(old_daily) != 1:
              raise SystemExit(f'Two-path daily-count transform count: {source.count(old_daily)}')
          source = source.replace(old_daily, new_daily, 1)

          false_claim_pattern = r'''concise: current\.concise\.replace\(\n\s+"I had an idea for what one could look like",\n\s+"I built a preview of what one could look like",\n\s+\),'''
          false_claim_replacement = '''concise: current.concise.replace(/I had an idea[^.]*\\./i, "I built a website preview for the business."),'''
          source, false_claim_count = re.subn(false_claim_pattern, false_claim_replacement, source, count=1)
          if false_claim_count != 1:
              raise SystemExit(f'Prospect-agnostic false-built-claim transform count: {false_claim_count}')

          path.write_text(source, encoding='utf-8')
          print('Audit preprocessor completed.')
          PY
            python3 .github/scripts/audit_manual_lovable_workflow.py
          } 2>&1 | tee final-audit.log

      - name: Upload audit failure log
        if: steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: manual-lovable-final-audit
          path: final-audit.log

      - name: Stop after audit failure
        if: steps.audit.outcome == 'failure'
        run: exit 1

      - name: Run focused audit tests
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test tests/final-manual-workflow-audit.test.ts tests/approval-feedback.test.ts tests/manual-lovable-workflow.test.ts tests/autonomous-growth.test.ts tests/prospect-engine.test.ts tests/top-prospects.test.ts 2>&1 | tee focused-audit-tests.log

      - name: Upload focused test failure log
        if: steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: manual-lovable-focused-audit
          path: focused-audit-tests.log

      - name: Stop after focused test failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Run full test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Remove temporary audit files
        run: |
          rm -f .github/scripts/audit_manual_lovable_workflow.py
          rm -f .github/workflows/audit-manual-lovable-workflow.yml
          rm -f final-audit.log focused-audit-tests.log

      - name: Commit verified audit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining manual outreach safety issues [manual-lovable-audited]"
          git push origin HEAD:feature/manual-lovable-preview-workflow
