name: Final manual Lovable QA cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-lovable-preview-workflow
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply manual QA cleanup
        run: python3 .github/scripts/final_manual_qa_cleanup.py

      - name: Run focused tests
        run: npx tsx --test tests/manual-preview-qa.test.ts tests/final-manual-workflow-audit.test.ts tests/approval-feedback.test.ts tests/manual-lovable-workflow.test.ts tests/autonomous-growth.test.ts

      - name: Run full test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Remove temporary cleanup files
        run: |
          rm -f .github/scripts/final_manual_qa_cleanup.py
          rm -f .github/workflows/final-manual-qa-cleanup.yml

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish manual Lovable QA workflow [manual-lovable-qa]"
          git push origin HEAD:feature/manual-lovable-preview-workflow
