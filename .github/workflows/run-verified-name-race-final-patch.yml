name: Run final verified name race patch

on:
  pull_request:
    branches:
      - fix/verified-name-race-final

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'tmp/verified-name-race-final-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/verified-name-race-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python .github/verified-name-race-final-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Commit verified patch
        run: |
          rm .github/verified-name-race-final-patch.py
          rm .github/workflows/run-verified-name-race-final-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/autonomous-growth-repository.ts tests/final-manual-workflow-audit.test.ts .github/verified-name-race-final-patch.py .github/workflows/run-verified-name-race-final-patch.yml
          git commit -m "Fail safely on concurrent verified-name draft edits"
          git push origin HEAD:fix/verified-name-race-final
