name: PR65 GET signature fix

on:
  push:
    branches:
      - fix/autopilot-refresh-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'wishart1818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autopilot-refresh-runtime
          fetch-depth: 0
      - name: Restore valid Next.js GET route signature
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/engine/autonomous-growth/route.ts')
          text = path.read_text()
          old = 'export async function GET(request?: Request) {'
          new = 'export async function GET(request: Request) {'
          if old not in text:
              raise SystemExit('Expected optional GET signature was not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove one-time fixer
        run: rm .github/workflows/pr65-get-signature-fix.yml
      - name: Commit fix
        run: |
          git config user.name "wishart1818"
          git config user.email "wishart1818@gmail.com"
          git add app/api/engine/autonomous-growth/route.ts .github/workflows/pr65-get-signature-fix.yml
          git commit -m "Restore valid Autonomous Growth GET route signature"
          git push origin HEAD:fix/autopilot-refresh-runtime
