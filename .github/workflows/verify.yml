name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Apply one-time phone-conflict type alignment
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/first-party-phone-conflict'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/prospect-engine.ts")
          text = path.read_text()
          signal = '    | "public_phone_conflict"\n'
          if signal not in text:
              needle = '    | "business_domain_email_match"\n'
              if needle not in text:
                  raise SystemExit("identity signal union anchor not found")
              text = text.replace(needle, needle + signal, 1)
              path.write_text(text)
          PY

          if ! git diff --quiet -- lib/prospect-engine.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/prospect-engine.ts
            git commit -m "Align phone-conflict identity signal type"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify
