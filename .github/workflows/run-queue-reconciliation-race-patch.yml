name: Run queue reconciliation race patch

on:
  pull_request:
    branches:
      - fix/queue-reconciliation-noop-race

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'tmp/queue-reconciliation-noop-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/queue-reconciliation-noop-race
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python .github/queue-reconciliation-race-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Commit verified patch
        run: |
          rm .github/queue-reconciliation-race-patch.py
          rm .github/workflows/run-queue-reconciliation-race-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/autonomous-growth-repository.ts tests/final-manual-workflow-audit.test.ts .github/queue-reconciliation-race-patch.py .github/workflows/run-queue-reconciliation-race-patch.yml
          git commit -m "Prevent queue refresh races"
          git push origin HEAD:fix/queue-reconciliation-noop-race
